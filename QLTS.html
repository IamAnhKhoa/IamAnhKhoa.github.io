<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/1454/1454827.png"/>
<title>Kiểm tra & Hồ sơ thiết bị Tin học</title>
<style>
::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0f172a;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#loadingScreen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at center,#1e293b 0%,#0f172a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:99999;transition:opacity .4s ease,visibility .4s ease}
.spinner{width:48px;height:48px;
  border:4px solid rgba(99,102,241,.2);
  border-top:4px solid #6366f1;border-right:4px solid #10b981;
  border-radius:50%;animation:spin .8s linear infinite;
  box-shadow:0 0 25px rgba(99,102,241,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#f8fafc;font-size:15px;font-weight:700;margin-top:18px}
.loading-subtext{color:#94a3b8;font-size:12.5px;margin-top:6px}
#adminAuthModal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(15,23,42,.92);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;
  z-index:999999;padding:16px;box-sizing:border-box}
.auth-card{
  width:100%;max-width:420px;background:rgba(30,41,59,.95);
  border:1px solid rgba(99,102,241,.3);border-radius:22px;padding:28px 24px;
  box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 30px rgba(99,102,241,.2);
  color:#fff;text-align:center;animation:mIn .3s ease}
@keyframes mIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.auth-icon{width:56px;height:56px;background:rgba(99,102,241,.15);
  border:1px solid rgba(99,102,241,.4);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;font-size:26px}
.auth-title{font-size:19px;font-weight:800;color:#f8fafc;margin-bottom:6px}
.auth-subtitle{font-size:13px;color:#94a3b8;line-height:1.45}
.auth-ip-badge{display:inline-block;background:rgba(239,68,68,.15);
  border:1px solid rgba(239,68,68,.3);color:#fca5a5;
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;margin-top:10px}
.auth-header{margin-bottom:22px}
.auth-form-group{text-align:left;margin-bottom:16px}
.auth-form-group label{display:block;font-size:12.5px;font-weight:700;color:#cbd5e1;
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.auth-input{width:100%;height:46px;background:rgba(15,23,42,.8);
  border:1px solid rgba(255,255,255,.15);border-radius:12px;
  padding:0 14px;font-size:14.5px;color:#fff;
  outline:none;box-sizing:border-box;transition:all .2s}
.auth-input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.auth-error{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);
  color:#f87171;font-size:13px;padding:10px 12px;border-radius:10px;
  margin-bottom:16px;display:none;text-align:center;font-weight:600}
.auth-btn{width:100%;height:48px;background:linear-gradient(135deg,#6366f1,#4f46e5);
  border:none;border-radius:12px;color:#fff;font-size:15px;
  font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(99,102,241,.4);transition:all .2s}
.auth-btn:hover{background:#4f46e5}
.auth-btn:active{transform:scale(.98)}
.hidden{display:none!important}
.cd-box{margin-top:14px;font-size:13.5px;color:#cbd5e1;background:rgba(255,255,255,.06);padding:8px 16px;border-radius:10px;display:inline-block}
.cd-num{color:#38bdf8;font-weight:800;font-size:16px}
</style>
</head>
<body style="padding:0;margin:0;width:100%;height:100vh">

<div id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">⏳ Đang kết nối dữ liệu thiết bị...</div>
  <div class="loading-subtext">Hệ thống AI Scanner đang đồng bộ. Vui lòng chờ...</div>
</div>

<div id="adminAuthModal" class="hidden">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🛡️</div>
      <div class="auth-title">Xác Minh Quyền Admin</div>
      <div class="auth-subtitle">Phát hiện truy cập từ IP lạ. Vui lòng xác minh để tiếp tục.</div>
      <div class="auth-ip-badge" id="detectedIpBadge">IP: Đang kiểm tra...</div>
    </div>
    <div id="authErrorMsg" class="auth-error"></div>
    <form id="adminAuthForm" onsubmit="handleAuthSubmit(event)">
      <div class="auth-form-group">
        <label>Họ và tên Admin</label>
        <input type="text" id="adminNameInput" class="auth-input" placeholder="Nhập họ và tên..." required autocomplete="off">
      </div>
      <div class="auth-form-group">
        <label>Ngày tháng năm sinh</label>
        <input type="text" id="adminDobInput" class="auth-input" placeholder="dd/mm/yyyy" required autocomplete="off">
      </div>
      <button type="submit" class="auth-btn">🔒 Xác Minh & Truy Cập</button>
    </form>
  </div>
</div>

<iframe id="appIframe" allow="clipboard-read; clipboard-write;"
        style="width:100%;height:100%;border:none;display:block;"></iframe>

<script>
!function(){
  // ── 1. CHẶN PHÍM TẮT SOI CODE & CHUỘT PHẢI ──────────────────────
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if(e.keyCode===123 || (e.ctrlKey && e.shiftKey && (e.keyCode===73 || e.keyCode===74 || e.keyCode===67)) || (e.ctrlKey && (e.keyCode===85 || e.keyCode===83))){
      e.preventDefault();
      _sd();
      return false;
    }
  });

  // ── 2. HÀM TỰ HỦY + ĐẾM NGƯỢC 10 GiÂY ĐỂ THỬ LẠI (AUTO-RECOVER) ──
  var _dOpen=false;
  function _sd(){
    if(_dOpen)return; _dOpen=true;
    var el=document.getElementById('appIframe');
    if(el){ 
      try{ el.src='about:blank'; }catch(e){}
      if(el.parentNode) el.parentNode.removeChild(el); 
    }
    
    var cnt = 10;
    document.body.innerHTML='<div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#0f172a;color:#ef4444;font-family:sans-serif;text-align:center;padding:20px;"><div><h1 style="font-size:54px;margin-bottom:10px;">🛡️</h1><h2>CẢNH BÁO BẢO MẬT HỆ THỐNG</h2><p style="color:#94a3b8;margin-top:10px;font-size:14px;">Phát hiện thao tác F12 / Soi mã nguồn. Thẻ ứng dụng đã tự hủy!</p><div class="cd-box">Tự động khôi phục trang sau: <span id="cdTimer" class="cd-num">10s</span></div></div></div>';
    
    var timer = setInterval(function(){
      cnt--;
      var tEl = document.getElementById('cdTimer');
      if(tEl) tEl.textContent = cnt + 's';
      if(cnt <= 0){
        clearInterval(timer);
        window.location.reload();
      }
    }, 1000);
  }

  // ── 3. KHÓA GIẢI MÃ XOR ──────────────────────────────────────────
  var _K=[81,76,84,83,50,48,50,54,95,83,69,67,82,69,84];

  // ── URL CLOUDFLARE PROXY (MÃ HÓA XOR): https://qlts-proxy.sockladien.workers.dev
  var _DU="39382023410a1d192e3f31307f35263e342d7d415f515d3332212a372b7a26232638574241183b3633";
  var _DI="60787a6100041c0767646b726070";
  var _H=["f5cfa8aa3280a4824bbd0c2bb7eeefc5630502a9dddcfe3816471605de49b7ee",
          "a819448cf73a255cd00a7b2896e54c4910d7faa934bc63828cfe1d3f2bdb8aa1"];

  function _xd(h){
    var o="",K=_K;
    for(var i=0;i<h.length;i+=2)
      o+=String.fromCharCode(parseInt(h.substr(i,2),16)^K[(i/2)%K.length]);
    return o;
  }

  var _url=_xd(_DU); _DU=null;
  var _tip=_xd(_DI); _DI=null; _K=null;

  async function sha256(m){
    var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }

  var iframe  =document.getElementById('appIframe');
  var loader  =document.getElementById('loadingScreen');
  var modal   =document.getElementById('adminAuthModal');
  var ipBadge =document.getElementById('detectedIpBadge');
  var _phase  =0;

  function hideLoader(){
    if(!loader)return;
    loader.style.opacity='0';loader.style.visibility='hidden';
    setTimeout(function(){if(loader&&loader.parentNode)loader.parentNode.removeChild(loader);},300);
  }

  function loadIframeApp(){
    if(_dOpen)return;
    var sp=window.location.search||'',hp=window.location.hash||'';
    var finalUrl=_url+sp+hp;

    var blobHtml='<!DOCTYPE html><html><head><meta charset="utf-8">'
      +'<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0f172a}</style>'
      +'</head><body><scr'+'ipt>'
      +'window.addEventListener("message",function(e){'
      +'var d=e.data;if(d&&d._t==="GO"&&d._p){window.location.replace(d._p.join(""));}'
      +'},false);<\/scr'+'ipt></body></html>';

    var bUrl=URL.createObjectURL(new Blob([blobHtml],{type:'text/html'}));
    _phase=0;

    iframe.onload=function(){
      if(_phase===0){
        _phase=1;
        URL.revokeObjectURL(bUrl);
        var m=Math.floor(finalUrl.length/3);
        try{iframe.contentWindow.postMessage({_t:'GO',_p:[finalUrl.slice(0,m),finalUrl.slice(m,m*2),finalUrl.slice(m*2)]},'*');}catch(e){}
        finalUrl=null;
      } else {
        hideLoader();
      }
    };
    iframe.src=bUrl;
  }

  function grantAccess(){modal.classList.add('hidden');loadIframeApp();}

  function fetchIP(){
    var t=new Promise(function(_,rej){setTimeout(function(){rej('timeout');},2000);});
    var f=fetch('https://api.ipify.org?format=json')
      .then(function(r){return r.json();}).then(function(d){return d.ip;});
    var f2=fetch('https://api64.ipify.org?format=json')
      .then(function(r){return r.json();}).then(function(d){return d.ip;});
    return Promise.race([f,t]).catch(function(){return Promise.race([f2,t]);}).catch(function(){return '';});
  }

  async function init(){
    var sp=(window.location.search||'').toLowerCase();
    var hp=(window.location.hash||'').toLowerCase();

    var pub=sp.indexOf('lookup')!==-1||sp.indexOf('tracuu')!==-1||
            sp.indexOf('code=')!==-1||sp.indexOf('device=')!==-1||
            sp.indexOf('id=')!==-1||sp.indexOf('qr=')!==-1||
            sp.indexOf('tb=')!==-1||hp.indexOf('lookup')!==-1||
            hp.indexOf('tracuu')!==-1||hp.indexOf('code=')!==-1;
    if(pub){grantAccess();return;}

    if(sessionStorage.getItem('TAK_ADMIN_VERIFIED')==='true'){grantAccess();return;}

    var ip=await fetchIP();
    if(ipBadge)ipBadge.textContent='IP của bạn: '+(ip||'Không xác định');

    if(ip===_tip){
      sessionStorage.setItem('TAK_ADMIN_VERIFIED','true');
      grantAccess();
    } else {
      if(loader)loader.classList.add('hidden');
      modal.classList.remove('hidden');
    }
    _tip=null;
  }

  window.handleAuthSubmit=async function(e){
    e.preventDefault();
    var name=(document.getElementById('adminNameInput').value||'').trim();
    var dob =(document.getElementById('adminDobInput').value||'').trim();
    var err =document.getElementById('authErrorMsg');
    var norm=name.toLowerCase().replace(/\s+/g,' ');
    var nacc=norm.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    var ndob=dob.replace(/[\/\-\.]/g,'');
    var h1=await sha256(norm+'|'+ndob);
    var h2=await sha256(nacc+'|'+ndob);
    if(_H.indexOf(h1)!==-1||_H.indexOf(h2)!==-1){
      sessionStorage.setItem('TAK_ADMIN_VERIFIED','true');
      err.style.display='none';
      if(loader)loader.classList.remove('hidden');
      grantAccess();
    } else {
      err.style.display='block';
      err.textContent='⚠️ Xác minh thất bại! Họ tên hoặc Ngày sinh không đúng.';
    }
  };

  init();
}();
</script>
</body>
</html>
