<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/1454/1454827.png"/>
<title>Kiểm tra & Hồ sơ thiết bị Tin học</title>
<style type="text/css">
::-webkit-scrollbar { display: none; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

/* 🌟 Màn hình chờ nạp dữ liệu Iframe */
#loadingScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(99, 102, 241, 0.2);
  border-top: 4px solid #6366f1;
  border-right: 4px solid #10b981;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-text {
  color: #f8fafc;
  font-size: 15px;
  font-weight: 700;
  margin-top: 18px;
  letter-spacing: 0.3px;
}

.loading-subtext {
  color: #94a3b8;
  font-size: 12.5px;
  margin-top: 6px;
}
</style>
</head>
<body style="padding: 0px; margin: 0px; width: 100%; height: 100vh; border: none">

  <!-- ⏳ Màn hình chờ tự động hiển thị trong lúc nạp iframe -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">⏳ Đang kết nối dữ liệu thiết bị...</div>
    <div class="loading-subtext">Hệ thống AI Scanner đang đồng bộ dữ liệu. Vui lòng chờ trong giây lát...</div>
  </div>

  <!-- 📲 Iframe hiển thị ứng dụng Web Apps Script -->
  <iframe id="appIframe" allow="clipboard-read; clipboard-write;" style="width: 100%; height: 100%; border: none;"></iframe>

  <script>
    (function() {
      // 1. Địa chỉ Google Apps Script Web App
      var baseUrl = "https://script.google.com/macros/s/AKfycbwaKNB5tFdFWY2wquGU2eqQprwCGhlvP93Xtp21FvgFQ24P7q29jNUdx0ejo6eTtOje/exec";
      
      // 2. Tự động lấy các tham số URL đằng sau (Ví dụ: ?code=TB-0027)
      var searchParams = window.location.search || '';
      var hashParams = window.location.hash || '';

      var iframe = document.getElementById('appIframe');
      var loader = document.getElementById('loadingScreen');

      // 3. Tự động ẩn màn hình chờ ngay khi iframe tải xong dữ liệu
      iframe.onload = function() {
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          setTimeout(function() {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 450);
        }
      };

      // 4. Ghép tham số và nạp vào iframe
      iframe.src = baseUrl + searchParams + hashParams;
    })();
  </script>

</body>
</html>
